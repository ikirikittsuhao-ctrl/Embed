<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仙人tube for embed</title>
  <!-- Google Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --yt-bg: #0f0f0f;
      --yt-header-bg: #0f0f0f;
      --yt-input-bg: #121212;
      --yt-input-border: #303030;
      --yt-btn-bg: #222222;
      --yt-btn-hover: #383838;
      --yt-text-main: #f1f1f1;
      --yt-text-sub: #aaa;
      --yt-accent: #cc0000;
      --yt-blue: #3ea6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Roboto", "Arial", sans-serif;
      background-color: var(--yt-bg);
      color: var(--yt-text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー (YouTube Style) */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 56px;
      background-color: var(--yt-header-bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-icon {
      font-size: 24px;
      color: var(--yt-text-main);
      cursor: pointer;
      user-select: none;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--yt-text-main);
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
    }

    .yt-icon {
      width: 30px;
      height: 22px;
      background-color: var(--yt-accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .yt-icon-play {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 5px 0 5px 10px;
      border-color: transparent transparent transparent #ffffff;
    }

    /* 中央検索バー (YouTube Style) */
    .header-center {
      flex: 0 1 732px;
      display: flex;
      align-items: center;
      margin: 0 16px;
    }

    .search-box {
      display: flex;
      width: 100%;
      height: 40px;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background-color: var(--yt-input-bg);
      border: 1px solid var(--yt-input-border);
      border-radius: 40px 0 0 40px;
      padding: 0 16px;
      margin-left: 32px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    }

    .input-wrapper:focus-within {
      border-color: var(--yt-blue);
      margin-left: 0;
    }

    .search-icon-inside {
      display: none;
      font-size: 20px;
      color: var(--yt-text-sub);
      margin-right: 12px;
      user-select: none;
    }

    .input-wrapper:focus-within .search-icon-inside {
      display: block;
    }

    .input-wrapper input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--yt-text-main);
      font-size: 1rem;
    }

    .input-wrapper input::placeholder {
      color: #888;
    }

    .paste-btn {
      background: none;
      border: none;
      color: var(--yt-blue);
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      padding: 4px 8px;
    }

    .search-btn {
      width: 64px;
      height: 40px;
      background-color: var(--yt-btn-bg);
      border: 1px solid var(--yt-input-border);
      border-left: none;
      border-radius: 0 40px 40px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .search-btn:hover {
      background-color: var(--yt-btn-hover);
    }

    .search-btn .material-symbols-outlined {
      font-size: 20px;
      color: var(--yt-text-main);
      user-select: none;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--yt-text-main);
      cursor: pointer;
    }

    .user-avatar .material-symbols-outlined {
      font-size: 20px;
      user-select: none;
    }

    /* メインコンテンツレイアウト (Watch Page Style) */
    .main-container {
      max-width: 1750px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }

    @media (min-width: 1000px) {
      .main-container {
        grid-template-columns: 1fr 380px;
      }
    }

    .player-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--yt-text-sub);
      text-align: center;
      padding: 20px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .video-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .error-msg {
      color: #ff4e4e;
      font-size: 0.9rem;
      display: none;
    }

    /* 右サイドバー（履歴・リスト再現） */
    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--yt-input-border);
      padding-bottom: 8px;
    }

    .sidebar-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--yt-blue);
      font-size: 0.85rem;
      cursor: pointer;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .history-item {
      display: flex;
      gap: 8px;
      cursor: pointer;
      border-radius: 8px;
      padding: 4px;
      transition: background-color 0.2s;
    }

    .history-item:hover {
      background-color: var(--yt-btn-bg);
    }

    .history-thumb {
      width: 120px;
      aspect-ratio: 16 / 9;
      background-color: #222;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .history-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .history-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--yt-text-main);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .history-meta {
      font-size: 0.75rem;
      color: var(--yt-text-sub);
    }
  </style>
</head>
<body>

  <!-- YouTube Style Header -->
  <header>
    <div class="header-left">
      <span class="material-symbols-outlined menu-icon">menu</span>
      <a href="#" class="brand-logo">
        <div class="yt-icon"><div class="yt-icon-play"></div></div>
      </a>
    </div>

    <div class="header-center">
      <div class="search-box">
        <div class="input-wrapper">
          <span class="material-symbols-outlined search-icon-inside">search</span>
          <input type="text" id="urlInput" placeholder="検索またはYouTube URL / IDを入力..." />
          <button class="paste-btn" id="pasteBtn">貼り付け</button>
        </div>
        <button class="search-btn" id="playBtn" title="再生">
          <span class="material-symbols-outlined">search</span>
        </button>
      </div>
    </div>

    <div class="header-right">
      <div class="user-avatar">
        <span class="material-symbols-outlined">account_circle</span>
      </div>
    </div>
  </header>

  <!-- Main Watch Content -->
  <main class="main-container">
    <div class="player-section">
      <div class="player-wrapper">
        <div id="placeholder" class="player-placeholder">
          <svg width="64" height="64" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
          </svg>
          <p>上の入力バーにYouTubeのURLまたは動画IDを入力して検索ボタンを押してください</p>
        </div>
        <iframe id="nocookieFrame" style="display: none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>

      <div class="video-info">
        <h1 class="video-title" id="videoTitleDisplay">仙人tube for embed - 埋め込みプレイヤー</h1>
        <div id="errorMsg" class="error-msg">有効なYouTube URLまたは動画IDを入力してください。</div>
      </div>
    </div>

    <!-- 右側：再生履歴 -->
    <aside class="sidebar-section" id="historySection">
      <div class="sidebar-header">
        <h2>最近再生した動画</h2>
        <button class="clear-btn" id="clearHistoryBtn">消去</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </aside>
  </main>

  <script>
    const urlInput = document.getElementById('urlInput');
    const playBtn = document.getElementById('playBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const iframe = document.getElementById('nocookieFrame');
    const placeholder = document.getElementById('placeholder');
    const errorMsg = document.getElementById('errorMsg');
    const videoTitleDisplay = document.getElementById('videoTitleDisplay');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');

    // YouTube Video IDの抽出
    function extractVideoId(input) {
      const trimmed = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
        return trimmed;
      }
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = trimmed.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 動画再生のメイン処理
    function loadVideo(id) {
      const videoId = id || extractVideoId(urlInput.value);

      if (videoId) {
        errorMsg.style.display = 'none';
        iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
        iframe.style.display = 'block';
        placeholder.style.display = 'none';
        videoTitleDisplay.innerText = `再生中 (ID: ${videoId})`;

        saveToHistory(videoId);
      } else {
        errorMsg.style.display = 'block';
      }
    }

    // 貼り付けボタンの挙動
    pasteBtn.addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        urlInput.value = text;
        loadVideo();
      } catch (err) {
        alert('クリップボードの読み取り権限が許可されていません');
      }
    });

    // LocalStorageを使った再生履歴管理
    function getHistory() {
      return JSON.parse(localStorage.getItem('sennin_yt_official_history') || '[]');
    }

    function saveToHistory(id) {
      let history = getHistory();
      history = history.filter(item => item !== id);
      history.unshift(id);
      if (history.length > 8) history.pop();

      localStorage.setItem('sennin_yt_official_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      historyList.innerHTML = '';

      if (history.length === 0) {
        historyList.innerHTML = '<p style="color: var(--yt-text-sub); font-size: 0.85rem;">履歴はありません</p>';
        return;
      }

      history.forEach(id => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
          <div class="history-thumb">
            <img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="Thumbnail">
          </div>
          <div class="history-details">
            <div class="history-title">動画 ID: ${id}</div>
            <div class="history-meta">仙人tube • 履歴</div>
          </div>
        `;
        item.addEventListener('click', () => {
          urlInput.value = id;
          loadVideo(id);
        });
        historyList.appendChild(item);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      localStorage.removeItem('sennin_yt_official_history');
      renderHistory();
    });

    // イベントリスナー設定
    playBtn.addEventListener('click', () => loadVideo());
    urlInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadVideo();
    });

    // 初期化
    renderHistory();
  </script>
</body>
</html>
